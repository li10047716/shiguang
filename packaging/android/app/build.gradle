plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.shiguang.reader'
    compileSdk 34

    defaultConfig {
        applicationId "com.shiguang.reader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // 按需增减架构：真机一般是 arm64-v8a，模拟器是 x86_64
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }

    python {
        // 把 server 包解压到文件系统，app.py 才能用真实路径读写 web/ 与缓存
        extractPackages "server"
        // buildPython 指向本机 Python 3.8+；已在 PATH 则可省略：
        // buildPython "C:/Python311/python.exe"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

// 阅读器只用 Python 标准库，无需 pip 安装任何第三方包
chaquopy {
    defaultConfig { }
}
