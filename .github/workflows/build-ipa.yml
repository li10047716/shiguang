name: Build iOS IPA

# 触发方式：
#   - Actions 页面手动运行（workflow_dispatch）
#   - 打 v* 标签自动运行
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备应用代码与 CPython 支持包
        run: bash packaging/ios/ci/prepare.sh

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: packaging/ios/app
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee xcodegen.log | tail -20
      - name: 上报失败日志（生成失败时）
        if: failure()
        working-directory: packaging/ios/app
        run: |
          {
            echo "### xcodegen 输出（尾部 60 行）"
            echo '```'
            tail -60 xcodegen.log 2>/dev/null || echo "(无日志)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 编译（免签名，产出 .app）
        working-directory: packaging/ios/app
        run: |
          xcodebuild \
            -project ShiguangReader.xcodeproj \
            -scheme ShiguangReader \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            build 2>&1 | tee xcodebuild.log | tail -25
          exit ${PIPESTATUS[0]}
      - name: 上报失败日志（编译失败时）
        if: failure()
        working-directory: packaging/ios/app
        run: |
          {
            echo "### xcodebuild 错误（相关行）"
            echo '```'
            grep -E "error:|warning: .*(No such|not found)|BUILD" xcodebuild.log | tail -40 || tail -40 xcodebuild.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 打包为未签名 ipa
        run: |
          mkdir -p output Payload
          cp -R packaging/ios/app/build/Build/Products/Release-iphoneos/ShiguangReader.app Payload/
          zip -qry output/ShiguangReader-unsigned.ipa Payload
          ls -lh output/

      - name: 上传 ipa（在 Actions 运行页面的 Artifacts 里下载）
        uses: actions/upload-artifact@v4
        with:
          name: ShiguangReader-ipa
          path: output/ShiguangReader-unsigned.ipa
          if-no-files-found: error
